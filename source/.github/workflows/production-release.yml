name: Zunévio production release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated signed build to both repositories'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          python scripts/prepare_android37_legacy.py "$ANDROID_HOME"
      - name: Restore private signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > owner-release.jks
          printf 'storeFile=owner-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build optimized production APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --console=plain
      - name: Unit tests and Android lint
        id: qa
        continue-on-error: true
        run: ./gradlew --continue :app:testProdReleaseUnitTest :shared:jvmTest :sharedUi:jvmTest :app:lintProdRelease -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --console=plain
      - name: Validate reports, signature and package; prepare assets
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zunevio-production-release
          path: dist/*
          if-no-files-found: error
      - name: Publish the same verified build to both repositories
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: python scripts/publish_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Validation-reports
          path: |
            app/build/test-results/
            shared/build/test-results/
            sharedUi/build/test-results/
            app/build/reports/lint-results-prodRelease.xml
            dist/VALIDATION.json
      - name: Remove signing material
        if: always()
        run: rm -f owner-release.jks keystore.properties local.properties
