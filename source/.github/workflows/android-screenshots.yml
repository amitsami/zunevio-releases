name: Android app screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the published production APK
        run: |
          curl -fL --retry 3 'https://github.com/amitsami/zunevio-releases/releases/download/v1.2.1/Zunevio-1.2.1-universal.apk' -o release.apk
          echo '20a7ef95b31fbc5ede54b54484d0b2c7fc9c9a0d517ecd9f94aece1c59d1f2d6  release.apk' | sha256sum -c
          cp scripts/screenshot-fixtures/preview.flac preview.flac
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python scripts/capture_android_screens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-phone-screenshots
          path: phone-screenshots/
          if-no-files-found: error
